<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family: sans-serif;
            background-color: #02372e;
        }
        ul {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
        }
        ul li{
            list-style: none;
        }
        ul li a{
            position: relative;
            display: block;
            text-transform: uppercase;
            margin: 20px 0;
            padding: 10px 20px;
            text-decoration: none;
            color: #fde907;
            font-family: sans-serif;
            font-size: 18px;
            font-weight: 600;
            transition: 0.5s;
            z-index: 1;
        }
        ul li a:before{
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-top: 2px solid #fde907;
            border-bottom: 2px solid #fde907;
            transform: scaleY(2);
            opacity: 0;
            transition: 0.3;
        }
        ul li a:after{
            content: "";
            position: absolute;
            top: 2px;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fde907;
            transform: scale(0);
            opacity: 0;
            transition: 0.3s;          
            z-index: -1;
        }
        ul li a:hover{
            color: #012822;
        }
        ul li a:hover::before{
            transform: scaleY(1);
            opacity: 1;
        }
        ul li a:hover::after{
            transform: scale(1);
            opacity: 1;
        }
        .img_1{
            object-fit: contain;
        }
        .img_1{
            position: relative;
            display: flex;
            margin: auto;
            border-radius: 50%;
            border: solid red 5px;
        }
        div{
            padding-bottom: 50%;
            margin-bottom: 50%;
        }
        .a1{
            text-align: center;
            font-size: 40px;
            margin-top: -1%;
            padding-top: px;
        }
        strong{
            color: red;
            font-size: 55px;
        }
    </style>
</head>

    </div>
</body>
